name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest suite
        run: python -m pytest backend/tests -q

      - name: Run legacy tests
        run: python tests/test_agents.py

      - name: Verify migrations apply
        env:
          DATABASE_URL: sqlite:////tmp/ci_migrate.db
        run: |
          python -m alembic upgrade head
          python -c "import sqlite3; c=sqlite3.connect('/tmp/ci_migrate.db'); n=c.execute(\"select count(*) from sqlite_master where type='table'\").fetchone()[0]; assert n >= 19, n; print('tables:', n)"

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          python3 -c "import json; m=json.load(open('dist/manifest.webmanifest')); assert m['display']=='standalone'; print('PWA manifest OK:', m['name'])"

      - name: Upload PWA dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-pages:
    name: Deploy PWA to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build with GitHub Pages base path
        working-directory: frontend
        env:
          BASE_PATH: /MUMAP/
        run: npm run build

      - name: Add SPA 404 fallback
        working-directory: frontend
        run: |
          cp dist/index.html dist/404.html
          test -f dist/manifest.webmanifest && test -f dist/sw.js
          python3 -c "import json; m=json.load(open('dist/manifest.webmanifest')); assert m['scope']=='/MUMAP/' and m['start_url']=='/MUMAP/', m; print('Pages manifest OK')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
