version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: multi-agent-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./logs:/logs
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret}
      - DATABASE_URL=sqlite:////data/multi_agent.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  multi-agent-data:
